<header class="site-header">
  <a routerLink="/" class="brand">{{ title }}</a>
  @if (session.isLoggedIn()) {
    <nav>
      <a routerLink="/matches" routerLinkActive="active">Search</a>
      <a routerLink="/matches/saved" routerLinkActive="active">Saved</a>
      <a routerLink="/reviews" routerLinkActive="active">Reviews</a>
      <a routerLink="/messages" routerLinkActive="active">Messages</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <button type="button" class="linkish" (click)="logout()">Sign out</button>
    </nav>
  } @else {
    <nav>
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    </nav>
  }
</header>
<main>
  <router-outlet />
</main>
